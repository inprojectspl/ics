# Local reverse proxy of the micro-application profile: the same nginx rules
# as production (docs/deploy/nginx.example.conf), with a certificate from the
# profile's own CA (scripts/microapps-local.sh creates it in .microapps-local/tls;
# trusting it in a browser is a separate, explicit step).

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Containers get a new address when restarted; re-resolve their names
# (Docker's DNS) instead of keeping the address found at nginx start.
resolver 127.0.0.11 valid=5s ipv6=off;

upstream ics_backend  { zone ics_backend 64k;  server backend:8000 resolve; }
upstream ics_frontend { zone ics_frontend 64k; server frontend:5173 resolve; }
upstream ics_broker   { zone ics_broker 64k;   server broker:8080 resolve; }
upstream ics_mailpit  { zone ics_mailpit 64k;  server mailpit:8025 resolve; }

ssl_certificate     /etc/nginx/tls/server.crt;
ssl_certificate_key /etc/nginx/tls/server.key;
ssl_protocols       TLSv1.3;

# Host keeps its port (ics.localhost:8443): the broker matches app hosts and
# the frontend dev server checks allowed hosts on it.
proxy_http_version 1.1;
proxy_set_header Host $http_host;
include /etc/nginx/conf.d/proxy-common.inc;
proxy_read_timeout 60s;
client_max_body_size 110m;
server_tokens off;

# ---------- ics.localhost (panel and API) ----------

server {
    listen 8443 ssl;
    http2 on;
    server_name ics.localhost;

    # The broker-facing API exists only on the private network.
    location ^~ /api/internal/ { return 404; }
    location = /api/internal  { return 404; }
    # Bundle pages run only on their own origin (html.ics.localhost).
    location ^~ /html { return 404; }

    location /api/ {
        proxy_pass http://ics_backend;
        # Server-Sent Events (notifications) must not be buffered.
        proxy_buffering off;
        proxy_read_timeout 1h;
    }
    location /.well-known/ { proxy_pass http://ics_backend; }
    location = /healthz    { proxy_pass http://ics_backend; }
    location = /readyz     { proxy_pass http://ics_backend; }

    location / {
        proxy_pass http://ics_frontend;
        # Vite hot reload.
        include /etc/nginx/conf.d/proxy-common.inc;
        proxy_set_header Host       $http_host;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}

# ---------- html.ics.localhost (HTML bundle viewer) ----------

server {
    listen 8443 ssl;
    http2 on;
    server_name html.ics.localhost;

    location / {
        rewrite ^(.*)$ /html$1 break;
        proxy_pass http://ics_backend;
    }
}

# ---------- *.ics-apps.localhost (micro-applications, a site of their own) ----------

server {
    listen 8443 ssl;
    http2 on;
    server_name *.ics-apps.localhost;
    client_max_body_size 2m;

    location / { proxy_pass http://ics_broker; }
}

# ---------- mail.ics.localhost (Mailpit) ----------

server {
    listen 8443 ssl;
    http2 on;
    server_name mail.ics.localhost;

    location / {
        proxy_pass http://ics_mailpit;
        include /etc/nginx/conf.d/proxy-common.inc;
        proxy_set_header Host       $http_host;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}

# ---------- tunnel entry points (loopback only) ----------
# See "Sharing through a tunnel" in docs/development/microapps-local.md. The
# tunnel terminates TLS; the same rules as on ics.localhost apply, and the
# frontend dev server sees its usual host.

server {
    listen 8481;
    server_name _;

    location ^~ /api/internal/ { return 404; }
    location = /api/internal  { return 404; }
    location ^~ /html { return 404; }

    location /api/ {
        proxy_pass http://ics_backend;
        proxy_buffering off;
        proxy_read_timeout 1h;
    }
    location /.well-known/ { proxy_pass http://ics_backend; }
    location = /healthz    { proxy_pass http://ics_backend; }
    location = /readyz     { proxy_pass http://ics_backend; }

    location / {
        proxy_pass http://ics_frontend;
        include /etc/nginx/conf.d/proxy-common.inc;
        proxy_set_header Host       ics.localhost:8443;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}

# The app origin of a configured alias (ICS_MICROAPPS_PUBLIC_ALIASES).
server {
    listen 8482;
    server_name _;
    client_max_body_size 2m;

    location / { proxy_pass http://ics_broker; }
}
