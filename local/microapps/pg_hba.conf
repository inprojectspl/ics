# Local micro-application profile. Order matters: the first matching line wins.
# Socket inside the container: only the bootstrap superuser (init, doctor).
local   all             pgadmin                                 peer map=pgadmin
local   all             pgadmin                                 scram-sha-256
# Micro-application runtime and owner roles may reach ics_apps only, never
# the ICS metadata database. Owner roles are NOLOGIN; listed for clarity.
host    ics_apps,/^ics_apps_test_   /^ma_[0-9a-f]{32}(_pv)?_run$   samenet   scram-sha-256
host    all             /^ma_                                   all             reject
# ICS application and trusted provisioner, from the compose network.
host    ics,postgres,/^ics_(test_|drift_|mig|unified_)    ics                       samenet         scram-sha-256
host    ics_apps,postgres,/^ics_apps_test_   ics_apps_provisioner   samenet     scram-sha-256
# Read-only login for database tools; also from the host through OrbStack.
host    ics_apps        ics_apps_reader                         samenet         scram-sha-256
host    all             all                                     all             reject
