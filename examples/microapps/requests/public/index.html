<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rejestr wniosków</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <header><h1>Rejestr wniosków</h1><p id="who" class="muted">…</p></header>
  <main>
    <section id="mine" hidden>
      <h2>Moje wnioski</h2>
      <form id="new-request">
        <label>Tytuł <input name="title" maxlength="200" required></label>
        <label>Opis <textarea name="description" maxlength="8000" rows="3"></textarea></label>
        <button type="submit">Złóż wniosek</button>
      </form>
      <ul id="my-list" class="list"></ul>
    </section>
    <section id="review" hidden>
      <h2>Do zatwierdzenia</h2>
      <ul id="review-list" class="list"></ul>
    </section>
    <p id="status" role="status" class="muted"></p>
  </main>
  <script src="/__ics/sdk.js"></script>
  <script src="app.js"></script>
</body>
</html>
