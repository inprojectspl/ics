<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Equipment booking</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <header class="app-header">
    <div class="inner">
      <span class="mark" aria-hidden="true">E</span>
      <div><h1>Equipment booking</h1><p id="who" class="muted">…</p></div>
    </div>
  </header>
  <main>
    <section id="manage" class="card" hidden>
      <h2>Add equipment</h2>
      <form id="new-equipment" class="grid">
        <label>Name <input name="name" maxlength="120" required></label>
        <label>Category
          <select name="category"><option value="laptop">laptop</option><option value="projector">projector</option><option value="camera">camera</option><option value="other">other</option></select>
        </label>
        <label>Quantity <input name="quantity" type="number" min="1" max="1000" value="1" required></label>
        <button type="submit" class="primary">Add</button>
      </form>
    </section>
    <section id="catalog" class="card" hidden>
      <h2>Equipment <span id="catalog-count" class="count"></span></h2>
      <ul id="equipment-list" class="list"></ul>
    </section>
    <section id="mine" class="card" hidden>
      <h2>My bookings <span id="mine-count" class="count"></span></h2>
      <ul id="reservation-list" class="list"></ul>
    </section>
  </main>
  <p id="status" role="status"></p>
  <script src="/__ics/sdk.js"></script>
  <script src="app.js"></script>
</body>
</html>
