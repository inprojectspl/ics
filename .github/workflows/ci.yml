name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch or pull request cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  ICS_DEBUG: "1"
  ICS_SECRET_KEY: test-secret-for-ci-only
  ICS_DATABASE_URL: postgresql+asyncpg://ics:ics@localhost:5432/ics
  ICS_REDIS_URL: redis://localhost:6379/0

jobs:
  backend:
    name: Backend (lint, types, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:18.3-alpine
        env:
          POSTGRES_USER: ics
          POSTGRES_PASSWORD: ics
          POSTGRES_DB: ics
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ics" --health-interval 2s --health-timeout 5s --health-retries 30
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 2s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --frozen --group dev
      - run: uv run ruff check app tests
      - run: uv run ruff format --check app tests
      - run: uv run mypy app
      - name: Audit runtime dependencies
        run: |
          uv export --frozen --no-dev --no-emit-project --format requirements-txt -o requirements.txt
          # The export is fully pinned with hashes, so nothing needs resolving.
          uvx pip-audit --strict --no-deps --disable-pip -r requirements.txt
      # Tests run in parallel (pytest-xdist); each worker gets its own database.
      - run: uv run pytest -q --cov=app --cov-report=term --cov-fail-under=90

  frontend:
    name: Frontend (lint, types, tests, bundle)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm audit --omit=dev --audit-level=high
      # Coverage thresholds are defined in vitest.config.ts.
      - run: npm run test:coverage
      - run: npx vite build
      - run: node scripts/check-bundle.mjs

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18.3-alpine
        env:
          POSTGRES_USER: ics
          POSTGRES_PASSWORD: ics
          POSTGRES_DB: ics
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ics" --health-interval 2s --health-timeout 5s --health-retries 30
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      ICS_BASE_URL: http://localhost:5173
      ICS_CORS_ORIGINS: http://localhost:5173
      ICS_STORAGE_URL: fs:///tmp/ics-storage
      ICS_ALLOWED_DOMAINS: example.com
      ICS_BOOTSTRAP_ADMIN_EMAIL: admin@example.com
      ICS_BOOTSTRAP_ADMIN_PASSWORD: AdminPass123!
      ICS_API_PROXY_TARGET: http://127.0.0.1:8000
      E2E_BASE_URL: http://localhost:5173
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Start the backend
        working-directory: backend
        run: |
          uv sync --frozen
          uv run alembic upgrade head
          nohup uv run uvicorn app.main:app --host 127.0.0.1 --port 8000 > ../backend.log 2>&1 &
      - name: Start the frontend
        working-directory: frontend
        run: |
          npm ci --no-audit
          npx playwright install --with-deps chromium
          nohup npx vite --port 5173 --strictPort > ../vite.log 2>&1 &
      - name: Wait for both servers
        run: |
          for url in http://127.0.0.1:8000/healthz http://localhost:5173/; do
            for i in $(seq 1 60); do
              curl -fsS -o /dev/null "$url" && break
              [ "$i" = 60 ] && { echo "$url did not come up"; cat backend.log vite.log; exit 1; }
              sleep 2
            done
          done
      - run: npx playwright test
        working-directory: frontend
        env:
          CI: "true"
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
            backend.log
            vite.log
          retention-days: 7
